<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <rect width="400" height="250" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2d3436">Simple Circuit Diagram</text>

  <!-- Battery -->
  <line x1="60" y1="60" x2="60" y2="90" stroke="#2d3436" stroke-width="2"/>
  <line x1="45" y1="90" x2="75" y2="90" stroke="#2d3436" stroke-width="3"/>
  <line x1="50" y1="100" x2="70" y2="100" stroke="#2d3436" stroke-width="2"/>
  <line x1="45" y1="110" x2="75" y2="110" stroke="#2d3436" stroke-width="3"/>
  <line x1="50" y1="120" x2="70" y2="120" stroke="#2d3436" stroke-width="2"/>
  <line x1="60" y1="120" x2="60" y2="150" stroke="#2d3436" stroke-width="2"/>
  <text x="60" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c5ce7" font-weight="bold">Battery</text>
  <text x="30" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">+</text>
  <text x="30" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3498db">-</text>

  <!-- Wires from battery -->
  <line x1="60" y1="60" x2="160" y2="60" stroke="#2d3436" stroke-width="2"/>
  <line x1="60" y1="150" x2="160" y2="150" stroke="#2d3436" stroke-width="2"/>

  <!-- Switch -->
  <circle cx="160" cy="60" r="4" fill="#2d3436"/>
  <line x1="160" y1="60" x2="200" y2="45" stroke="#2d3436" stroke-width="2"/>
  <circle cx="210" cy="60" r="4" fill="#2d3436"/>
  <text x="185" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6c5ce7" font-weight="bold">Switch</text>

  <!-- Wire from switch to bulb -->
  <line x1="210" y1="60" x2="310" y2="60" stroke="#2d3436" stroke-width="2"/>

  <!-- Light Bulb -->
  <circle cx="310" cy="105" r="30" fill="none" stroke="#f39c12" stroke-width="2.5"/>
  <line x1="310" y1="60" x2="310" y2="75" stroke="#2d3436" stroke-width="2"/>
  <line x1="310" y1="135" x2="310" y2="150" stroke="#2d3436" stroke-width="2"/>
  <!-- Filament -->
  <path d="M300 90 L305 100 L310 90 L315 100 L320 90" fill="none" stroke="#f39c12" stroke-width="1.5"/>
  <text x="310" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c5ce7" font-weight="bold">Bulb</text>

  <!-- Wire from bulb back to battery -->
  <line x1="310" y1="150" x2="160" y2="150" stroke="#2d3436" stroke-width="2"/>

  <!-- Resistor on bottom wire -->
  <rect x="140" y="140" width="40" height="20" fill="none" stroke="#e74c3c" stroke-width="2"/>
  <text x="160" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6c5ce7" font-weight="bold">Resistor</text>

  <!-- Current direction arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00b894"/>
    </marker>
  </defs>
  <line x1="120" y1="52" x2="140" y2="52" stroke="#00b894" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="130" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#00b894">current</text>

  <!-- Question mark indicator -->
  <rect x="280" y="195" width="100" height="40" rx="8" fill="#6c5ce7" opacity="0.1"/>
  <text x="330" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c5ce7" font-weight="bold">What does the</text>
  <text x="330" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c5ce7" font-weight="bold">switch control?</text>
</svg>
