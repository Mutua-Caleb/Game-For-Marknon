<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700">
  <defs>
    <linearGradient id="deoxyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8d4e8;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#8bb8d9;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="oxyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8b8b8;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#d98b8b;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d5c8"/>
      <stop offset="100%" style="stop-color:#dbb8a8"/>
    </linearGradient>
  </defs>

  <!-- Heart outer wall -->
  <path d="M 300 95
           C 200 70, 70 115, 65 260
           C 60 400, 175 540, 300 620
           C 425 540, 540 400, 535 260
           C 530 115, 400 70, 300 95 Z"
        fill="url(#wallGrad)" stroke="#7a3b2e" stroke-width="3.5"/>

  <!-- Left ventricle thick wall (viewer's right) -->
  <path d="M 310 340 L 475 340 L 475 450
           C 440 530, 350 555, 310 505 Z"
        fill="none" stroke="#7a3b2e" stroke-width="5" opacity="0.5"/>

  <!-- === CHAMBERS === -->

  <!-- Right Atrium (viewer's left, upper) - deoxygenated blood (blue) -->
  <path d="M 110 155 L 285 155 L 285 320 L 110 320
           C 88 260, 88 215, 110 155 Z"
        fill="url(#deoxyBg)" stroke="#5a8aad" stroke-width="2"/>
  <text x="195" y="245" text-anchor="middle" font-size="13" fill="#3a6b8a" font-family="Arial" font-weight="bold" opacity="0.35">RA</text>

  <!-- Left Atrium (viewer's right, upper) - oxygenated blood (red) -->
  <path d="M 315 155 L 490 155
           C 512 215, 512 260, 490 320
           L 315 320 Z"
        fill="url(#oxyBg)" stroke="#ad5a5a" stroke-width="2"/>
  <text x="405" y="245" text-anchor="middle" font-size="13" fill="#8a3a3a" font-family="Arial" font-weight="bold" opacity="0.35">LA</text>

  <!-- Right Ventricle (viewer's left, lower) - deoxygenated (blue) -->
  <path d="M 110 340 L 285 340 L 285 500
           C 245 545, 155 530, 110 460 Z"
        fill="url(#deoxyBg)" stroke="#5a8aad" stroke-width="2"/>
  <text x="195" y="425" text-anchor="middle" font-size="13" fill="#3a6b8a" font-family="Arial" font-weight="bold" opacity="0.35">RV</text>

  <!-- Left Ventricle (viewer's right, lower) - oxygenated (red) -->
  <path d="M 315 340 L 475 340 L 475 460
           C 435 530, 355 545, 315 500 Z"
        fill="url(#oxyBg)" stroke="#ad5a5a" stroke-width="2"/>
  <text x="395" y="425" text-anchor="middle" font-size="13" fill="#8a3a3a" font-family="Arial" font-weight="bold" opacity="0.35">LV</text>

  <!-- === SEPTUM === -->
  <!-- Interatrial + Interventricular septum (vertical divider) -->
  <line x1="300" y1="135" x2="300" y2="520" stroke="#7a3b2e" stroke-width="5"/>

  <!-- AV junction (horizontal divider between atria and ventricles) -->
  <line x1="100" y1="330" x2="500" y2="330" stroke="#7a3b2e" stroke-width="3.5"/>

  <!-- === VALVES === -->

  <!-- Tricuspid Valve (between RA and RV) -->
  <path d="M 170 325 L 190 340 L 170 340 Z" fill="#c4a882" stroke="#8b6b4a" stroke-width="1.5"/>
  <path d="M 220 325 L 200 340 L 220 340 Z" fill="#c4a882" stroke="#8b6b4a" stroke-width="1.5"/>

  <!-- Bicuspid/Mitral Valve (between LA and LV) -->
  <path d="M 380 325 L 400 340 L 380 340 Z" fill="#c4a882" stroke="#8b6b4a" stroke-width="1.5"/>
  <path d="M 430 325 L 410 340 L 430 340 Z" fill="#c4a882" stroke="#8b6b4a" stroke-width="1.5"/>

  <!-- === BLOOD VESSELS === -->

  <!-- Superior Vena Cava (entering RA from top) -->
  <rect x="125" y="30" width="45" height="130" rx="8" fill="#6b9bd2" stroke="#3a6b9d" stroke-width="2.5"/>
  <!-- SVC flow arrow (downward) -->
  <polygon points="147,145 137,125 157,125" fill="#3a6b9d"/>

  <!-- Inferior Vena Cava (entering RA from bottom) -->
  <rect x="125" y="525" width="45" height="100" rx="8" fill="#6b9bd2" stroke="#3a6b9d" stroke-width="2.5"/>
  <!-- IVC flow arrow (upward) -->
  <polygon points="147,530 137,550 157,550" fill="#3a6b9d"/>

  <!-- Pulmonary Artery (leaving RV, going up) -->
  <rect x="225" y="30" width="45" height="130" rx="8" fill="#7ba0cc" stroke="#3a6b9d" stroke-width="2.5"/>
  <!-- PA flow arrow (upward) -->
  <polygon points="247,45 237,65 257,65" fill="#3a6b9d"/>
  <!-- Pulmonary valve cusps -->
  <ellipse cx="247" cy="155" rx="18" ry="5" fill="#c4a882" stroke="#8b6b4a" stroke-width="1.5"/>

  <!-- Aorta (leaving LV, arching up) -->
  <path d="M 345 30 L 385 30 L 385 130 C 385 150, 375 168, 360 170
           L 360 170 C 370 160, 355 145, 345 130 Z"
        fill="#d46b6b" stroke="#9d3a3a" stroke-width="2.5"/>
  <!-- Aorta flow arrow (upward) -->
  <polygon points="365,45 355,65 375,65" fill="#9d3a3a"/>
  <!-- Aortic valve cusps -->
  <ellipse cx="365" cy="168" rx="16" ry="5" fill="#c4a882" stroke="#8b6b4a" stroke-width="1.5"/>

  <!-- Pulmonary Veins (entering LA from right side) -->
  <rect x="465" y="170" width="90" height="35" rx="8" fill="#d47b7b" stroke="#9d3a3a" stroke-width="2.5"/>
  <rect x="465" y="220" width="90" height="35" rx="8" fill="#d47b7b" stroke="#9d3a3a" stroke-width="2.5"/>
  <!-- PV flow arrows (leftward) -->
  <polygon points="475,187 495,177 495,197" fill="#9d3a3a"/>
  <polygon points="475,237 495,227 495,247" fill="#9d3a3a"/>

  <!-- === FLOW DIRECTION ARROWS INSIDE CHAMBERS === -->

  <!-- Flow from RA → RV (through tricuspid) -->
  <path d="M 195 280 L 195 310" stroke="#4a85b0" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- Flow from LA → LV (through bicuspid) -->
  <path d="M 405 280 L 405 310" stroke="#b04a4a" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a85b0"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b04a4a"/>
    </marker>
  </defs>

  <!-- === LEGEND (subtle) === -->
  <rect x="20" y="660" width="15" height="15" rx="3" fill="#b8d4e8" stroke="#5a8aad" stroke-width="1"/>
  <text x="40" y="673" font-size="11" fill="#555" font-family="Arial">Deoxygenated blood</text>
  <rect x="200" y="660" width="15" height="15" rx="3" fill="#e8b8b8" stroke="#ad5a5a" stroke-width="1"/>
  <text x="220" y="673" font-size="11" fill="#555" font-family="Arial">Oxygenated blood</text>
</svg>
